name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      # Staged publishing needs npm 12. The version waits on npmjs.com until a
      # maintainer approves it with 2FA, so a workflow alone cannot publish.
      - run: npm install --global npm@12.2.1
      - run: npm stage publish --provenance
      - run: echo "Staged on npm. Approve it at https://www.npmjs.com/package/${{ github.event.repository.name }} with 2FA to publish." >> "$GITHUB_STEP_SUMMARY"
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
